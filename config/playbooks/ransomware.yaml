# =============================================================================
# Machine-readable playbook: Ransomware
# (initial access -> encryption -> lateral movement)
#
# Consumed by ir_soar.engine.playbook_loader / executor. The paired
# human-readable version lives at playbooks/ransomware.md — step ids in
# that document's "Automation Cross-Reference" table match the `id` fields
# below. This file deliberately reuses the exact same schema as
# phishing_lateral_movement.yaml to prove the engine needs zero changes to
# support a second scenario.
# =============================================================================

id: ransomware
name: "Ransomware: Initial Access -> Encryption -> Lateral Movement"
version: "1.0"
description: >
  Response playbook for a ransomware incident: an initial-access foothold
  (commonly phishing, exposed RDP, or a vulnerable public-facing service)
  leads to file encryption on one or more hosts, with evidence of or
  potential for lateral movement to spread further before containment.

mitre_attack:
  - tactic: "Initial Access"
    technique: "T1190"
    technique_name: "Exploit Public-Facing Application"
  - tactic: "Execution"
    technique: "T1059"
    technique_name: "Command and Scripting Interpreter"
  - tactic: "Defense Evasion"
    technique: "T1562.001"
    technique_name: "Impair Defenses: Disable or Modify Tools"
  - tactic: "Discovery"
    technique: "T1135"
    technique_name: "Network Share Discovery"
  - tactic: "Lateral Movement"
    technique: "T1021.001"
    technique_name: "Remote Services: Remote Desktop Protocol"
  - tactic: "Impact"
    technique: "T1486"
    technique_name: "Data Encrypted for Impact"

phases:
  - name: preparation
    steps: []   # readiness activities (see playbooks/ransomware.md, Section 3) — not automated

  - name: identification
    steps:
      - id: enrich_c2_ip
        action_type: ip_domain_reputation
        description: "Look up reputation for any suspected command-and-control IP/domain observed in alerts."
        inputs:
          target: "{{ incident.c2_indicator }}"
        requires_approval: false
        risk: low
        on_failure: continue_with_warning

      - id: hash_reputation_ransom_binary
        action_type: hash_reputation
        description: "Check reputation/known-family match for the suspected ransomware binary hash."
        inputs:
          hash: "{{ incident.ransom_binary_hash }}"
        requires_approval: false
        risk: low
        on_failure: continue_with_warning

      - id: correlate_encryption_activity
        action_type: log_correlation
        description: "Correlate file-system/EDR logs for mass file-modification activity consistent with encryption."
        inputs:
          user: "{{ incident.affected_user }}"
          window_minutes: 30
        requires_approval: false
        risk: low
        on_failure: continue_with_warning

      - id: correlate_lateral_movement_logs
        action_type: log_correlation
        description: "Correlate SMB/RDP/remote-service logs across the environment for spread beyond patient zero."
        inputs:
          user: "{{ incident.affected_user }}"
          window_minutes: 240
        condition: "steps.correlate_encryption_activity.result.suspicious == true"
        requires_approval: false
        risk: low
        on_failure: continue_with_warning

  - name: containment
    steps:
      - id: isolate_patient_zero
        action_type: isolate_host
        description: "Immediately network-isolate the first host observed encrypting files."
        inputs:
          hostname: "{{ incident.affected_host }}"
        requires_approval: true
        risk: high
        on_failure: abort_run

      - id: isolate_lateral_movement_hosts
        action_type: isolate_host
        description: "Network-isolate additional hosts identified during lateral-movement correlation."
        inputs:
          hostname: "{{ incident.lateral_movement_host }}"
        condition: "steps.correlate_lateral_movement_logs.result.suspicious == true"
        requires_approval: true
        risk: high
        on_failure: continue_with_warning

      - id: disable_compromised_account
        action_type: disable_account
        description: "Disable the account observed initiating encryption/lateral movement, pending investigation."
        inputs:
          username: "{{ incident.affected_user }}"
        requires_approval: true
        risk: high
        on_failure: continue_with_warning

      - id: block_c2_indicator
        action_type: block_ip_domain
        description: "Block the suspected command-and-control IP/domain at the perimeter."
        inputs:
          target: "{{ incident.c2_indicator }}"
        requires_approval: true
        risk: medium
        on_failure: continue_with_warning

  - name: eradication
    steps:
      - id: collect_forensics_patient_zero
        action_type: collect_forensics
        description: "Collect forensic artifacts (memory-relevant metadata, process/file listings) before rebuild."
        inputs:
          hostname: "{{ incident.affected_host }}"
        requires_approval: true
        risk: medium
        on_failure: continue_with_warning

  - name: recovery
    steps: []   # restore from clean backups, validate integrity, staged reconnection — human-driven, see MD

  - name: lessons_learned
    steps: []   # post-incident review — human-driven, see MD
